services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chiappetta
      POSTGRES_USER: chiappetta
      POSTGRES_PASSWORD: chiappetta_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - chiappetta_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiappetta -d chiappetta"]
      interval: 3s
      timeout: 2s
      retries: 10
volumes:
  chiappetta_local_data:
